baseURL = "https://landonblue.cn/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "蓝顿"
summaryLength = 80
paginate = 10
enableRobotsTXT = true

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "蓝顿的个人博客，记录技术探索、生活感悟与成长轨迹"
  heroTitle = "思考<span class='accent'>·</span>记录<span class='accent'>·</span>分享"
  heroDesc = "一个热爱技术、热爱生活的普通人的小天地。这里记录着代码、学习、潜水与生活的点点滴滴。"
  github = "https://github.com/wyml"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 4
