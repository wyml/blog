{{ define "main" }}
<div class="container">
  <section class="taxonomy-section">
    <div style="padding: var(--space-xl) 0 0;">
      <p class="hero-label" style="margin-bottom: var(--space-md)">// Tags</p>
      <h1 style="font-size:2.5rem; font-weight:800; letter-spacing:-0.04em; color:var(--clr-white); margin-bottom: var(--space-xl)">
        全部标签
      </h1>
    </div>

    <div class="section-label">
      <span>// {{ len .Pages }} tags</span>
    </div>

    <div class="taxonomy-grid">
      {{ range .Pages.ByTitle }}
      <a href="{{ .Permalink }}" class="taxonomy-item">
        # {{ .Title }}
        <span class="taxonomy-count">({{ len .Pages }})</span>
      </a>
      {{ end }}
    </div>
  </section>
</div>
{{ end }}
