<header class="site-header" role="banner">
  <nav class="nav-inner" aria-label="主导航">
    <a href="{{ "/" | relURL }}" class="site-logo" aria-label="{{ .Site.Title }} 首页">
      蓝顿
    </a>

    <div style="display:flex; align-items:center; gap: clamp(0.75rem, 3vw, 2rem);">
      <ul class="nav-links" role="list">
        <li><a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a></li>
        <li><a href="{{ "/posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>文章</a></li>
        <li><a href="{{ "/tags/" | relURL }}"{{ if or (eq .Kind "taxonomy") (eq .Kind "term") }} aria-current="page"{{ end }}>标签</a></li>
        <li><a href="{{ "/about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>关于</a></li>
      </ul>

      <!-- Theme Toggle Button -->
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="切换亮色/暗色模式"
        title="切换主题"
      >
        <!-- Sun icon — shown in dark mode, click = switch to light -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon — shown in light mode, click = switch to dark -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span style="display:none">切换主题</span>
      </button>
    </div>
  </nav>
</header>
