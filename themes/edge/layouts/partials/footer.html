<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-copy">
      &copy; {{ now.Year }} {{ .Site.Title }} — Built with Hugo &amp; Edge Theme
    </p>
    <div class="footer-links">
      {{ with .Site.Params.github }}<a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
      {{ with .Site.Params.twitter }}<a href="{{ . }}" target="_blank" rel="noopener">Twitter</a>{{ end }}
      <a href="{{ "/index.xml" | relURL }}">RSS</a>
    </div>
  </div>
</footer>
